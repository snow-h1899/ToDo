<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do App</title>
    <link rel="stylesheet" href="/Project/Smart To-Do App/styles.css">
</head>
<body>
    <div class="container">
        <h1 id="mainTitle"></h1>
        <div id="stats">
            <p id="taskCount">Total tasks: 0</p>
            <p id="completedCount">Completed tasks: 0</p>
        </div>
        <div id="input-section">
            <input type="text" id="taskInput" placeholder="Enter your task">
            <button id="addBtn">Add Task</button>
            <button id="importantBtn">Add Important</button>
            <button id="themeBtn">Toggle theme</button>
            <button id="clearAllBtn">Clear All</button>
        </div>
        <ul id="taskList"></ul>
    </div>
    <script src="/Project/Smart To-Do App/script.js"></script>
</body>
</html>
